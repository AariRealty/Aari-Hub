<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect with Marlenyi</title>
  <meta name="description" content="Please complete this form and I will reach out to you ASAP to connect!" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="title">Connect with Marlenyi</h1>
      <p class="subtitle">
        Please complete this form and I will reach out to you ASAP to connect!
      </p>
    </header>

    <form class="form" id="connect-form" novalidate>
      <!-- First Name -->
      <div class="field">
        <label class="label" for="first-name">
          First Name<span class="required" aria-hidden="true">*</span>
        </label>
        <input
          class="input"
          type="text"
          id="first-name"
          name="first_name"
          placeholder="Your answer"
          autocomplete="given-name"
          required
        />
      </div>

      <!-- Last Name -->
      <div class="field">
        <label class="label" for="last-name">
          Last Name<span class="required" aria-hidden="true">*</span>
        </label>
        <input
          class="input"
          type="text"
          id="last-name"
          name="last_name"
          placeholder="Your answer"
          autocomplete="family-name"
          required
        />
      </div>

      <!-- Phone Number -->
      <div class="field">
        <label class="label" for="phone">
          Phone Number<span class="required" aria-hidden="true">*</span>
        </label>
        <input
          class="input"
          type="tel"
          id="phone"
          name="phone"
          placeholder="Your answer"
          autocomplete="tel"
          required
        />
      </div>

      <!-- Email -->
      <div class="field">
        <label class="label" for="email">
          Email<span class="required" aria-hidden="true">*</span>
        </label>
        <input
          class="input"
          type="email"
          id="email"
          name="email"
          placeholder="Your answer"
          autocomplete="email"
          required
        />
      </div>

      <!-- Instagram Handle -->
      <div class="field">
        <label class="label" for="instagram">
          Instagram Handle<span class="required" aria-hidden="true">*</span>
        </label>
        <input
          class="input"
          type="text"
          id="instagram"
          name="instagram"
          placeholder="Your answer"
          required
        />
      </div>

      <!-- Preferred Method of Contact -->
      <fieldset class="field">
        <legend class="label">
          Preferred Method of Contact<span class="required" aria-hidden="true">*</span>
        </legend>
        <div class="options">
          <label class="option">
            <input type="radio" name="contact_method" value="Text" required />
            <span class="option__label">Text</span>
          </label>
          <label class="option">
            <input type="radio" name="contact_method" value="Call" />
            <span class="option__label">Call</span>
          </label>
          <label class="option">
            <input type="radio" name="contact_method" value="Email" />
            <span class="option__label">Email</span>
          </label>
          <label class="option">
            <input type="radio" name="contact_method" value="Instagram DM" />
            <span class="option__label">Instagram DM</span>
          </label>
        </div>
      </fieldset>

      <!-- Intent -->
      <fieldset class="field">
        <legend class="label">Intent</legend>
        <div class="options">
          <label class="option">
            <input type="radio" name="intent" value="Buy a home" />
            <span class="option__label">Buy a home</span>
          </label>
          <label class="option">
            <input type="radio" name="intent" value="Sell a property" />
            <span class="option__label">Sell a property</span>
          </label>
          <label class="option">
            <input type="radio" name="intent" value="Relocate to or from Southwest Florida" />
            <span class="option__label">Relocate to or from Southwest Florida</span>
          </label>
          <label class="option">
            <input type="radio" name="intent" value="Purchase an investment property" />
            <span class="option__label">Purchase an investment property</span>
          </label>
          <label class="option">
            <input type="radio" name="intent" value="Other" />
            <span class="option__label">Other</span>
          </label>
        </div>
      </fieldset>

      <!-- How Can I Help You? -->
      <div class="field">
        <label class="label" for="message">
          How Can I Help You?<span class="required" aria-hidden="true">*</span>
        </label>
        <textarea
          class="input textarea"
          id="message"
          name="message"
          placeholder="Your answer"
          rows="4"
          required
        ></textarea>
      </div>

      <button class="submit" type="submit">Submit</button>

      <div class="success" id="success" hidden>
        <h2>Thank you!</h2>
        <p>I've received your form and will reach out to you ASAP.</p>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("connect-form");
    const success = document.getElementById("success");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Basic HTML5 validity check
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // Collect form data
      const data = Object.fromEntries(new FormData(form).entries());
      console.log("Form submission:", data);

      // TODO: replace this with a real submission endpoint
      // (Formspree, Notion API, your own backend, etc.)

      // Show success state
      form
        .querySelectorAll(".field, .submit")
        .forEach((el) => (el.style.display = "none"));
      success.hidden = false;
      success.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</body>
</html>
